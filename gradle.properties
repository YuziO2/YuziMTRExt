org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# --- 工具链 ---
loom_version=1.9.2

# --- Minecraft / Fabric ---
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.3
fabric_api_version=0.92.11+1.20.1

# --- 被 patch 的目标 ---
# Modrinth 坐标: maven.modrinth:minecraft-transit-railway:FABRIC-<mtr_version>+<minecraft_version>
mtr_version=4.0.5

# 「模组菜单」的配置界面用（只在编译期需要，运行时没装也不影响）
modmenu_version=7.2.2

# --- 部署目标（./gradlew deployToClient / deployToServer）---
# 每台机器不一样，不放仓库里。写在自己的 ~/.gradle/gradle.properties：
#   client_mods_dir=<客户端的 mods 目录>
#   server_mods_dir=<服务端的 mods 目录>
# 不设也能正常构建，只有跑对应的部署任务时才会报错提示。

# --- 本 mod ---
mod_version=1.7.4
maven_group=com.yuzi
archives_base_name=yuzimtr
