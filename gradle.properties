# Gradle 守护进程跑在 JDK 17 上。系统装的是 JRE 21，而 Loom 用的 Mercury/JDT
# 在 JVM 21 下读不了 JRT（readJdkReleaseFile 直接崩），一旦有依赖带 sources jar
# 需要重映射就会挂。这个 JDK 是 Gradle 自己按 toolchain 配置装下来的。
# org.gradle.java.home=<本机 JDK 17 的路径>

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# --- 工具链 ---
loom_version=1.9.2

# --- Minecraft / Fabric ---
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.3
fabric_api_version=0.92.11+1.20.1

# --- 被 patch 的目标 ---
# Modrinth 坐标: maven.modrinth:minecraft-transit-railway:FABRIC-<mtr_version>+<minecraft_version>
mtr_version=4.0.5

# 「模组菜单」的配置界面用（只在编译期需要，运行时没装也不影响）
modmenu_version=7.2.2

# --- 部署目标（./gradlew deployToClient / deployToServer）---
client_mods_dir=/path/to/.minecraft/mods
server_mods_dir=/path/to/server/mods

# --- 本 mod ---
mod_version=1.4.0
maven_group=com.yuzi
archives_base_name=yuzimtr
